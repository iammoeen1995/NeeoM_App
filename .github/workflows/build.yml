name: Build NeeoM APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Clean Android Structure
        run: |
          rm -rf android
          flutter create . --org com.neoom --project-name neoom_app --platforms=android

      - name: Compile Debug APK
        run: flutter build apk --debug

      - name: Upload NeeoM APK
        uses: actions/upload-artifact@v4
        with:
          name: NeeoM-APK
          path: build/app/outputs/flutter-apk/app-debug.apk 